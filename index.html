<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern Weather Application - Get real-time weather updates for any city">
    <meta name="theme-color" content="#2193b0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Add favicon -->
    <link rel="icon" type="image/png" href="clear.png">
</head>
<body>
    <div class="card">
        <header class="app-header">
            <h1 class="app-title">Weather Forecast</h1>
        </header>
        
        <div class="search">
            <input 
                type="text" 
                placeholder="Enter city name..." 
                spellcheck="false"
                aria-label="Enter city name"
                autocomplete="off"
            >
            <button aria-label="Search weather">
                <img src="search.png" alt="Search icon">
            </button>
        </div>

        <div class="error" role="alert">
            <p>
                <span class="error-icon">⚠️</span>
                Invalid city name. Please try again.
            </p>
        </div>

        <main class="wether">
            <div class="weather-primary">
                <img src="rain.png" class="wather-icon" alt="Weather condition icon">
                <h2 class="temp">17°C</h2>
                <h3 class="city">Mathura</h3>
            </div>

            <div class="details">
                <div class="col">
                    <img src="humidity.png" alt="Humidity icon">
                    <div class="detail-info">
                        <p class="humidity">50%</p>
                        <p class="label">Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="wind.png" alt="Wind icon">
                    <div class="detail-info">
                        <p class="wind">15 km/h</p>
                        <p class="label">Wind Speed</p>
                    </div>
                </div>
            </div>

            <div class="last-updated">
                <p>Last updated: <span class="update-time">Just now</span></p>
            </div>
        </main>
    </div>

    <footer class="app-footer">
        <p>Created with ❤️ by Weather App Team</p>
    </footer>

    <script>
        const apikey = "54e50f85d9a1e6b4c3d0cbf30e26735d";
        const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
        
        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weathericon = document.querySelector(".wather-icon");

        // Update time function
        function updateLastUpdated() {
            const now = new Date();
            document.querySelector(".update-time").textContent = now.toLocaleTimeString();
        }

        async function checkWeather(city) {
            try {
                const res = await fetch(apiurl + city + `&appid=${apikey}`);

                if (res.status == 404) {
                    document.querySelector(".error").style.display = "block";
                    document.querySelector(".wether").style.display = "none";
                    return;
                }

                const data = await res.json();
                
                // Update UI elements
                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.floor(data.main.temp) + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

                // Update weather icon
                const weatherMain = data.weather[0].main.toLowerCase();
                const weatherIcons = {
                    clear: "clear.png",
                    clouds: "clouds.png",
                    drizzle: "drizzle.png",
                    rain: "rain.png",
                    mist: "mist.png"
                };

                weathericon.src = weatherIcons[weatherMain] || "clear.png";
                weathericon.alt = `${weatherMain} weather icon`;

                document.querySelector(".wether").style.display = "block";
                document.querySelector(".error").style.display = "none";
                
                // Update last updated time
                updateLastUpdated();
            } catch (error) {
                console.error("Error fetching weather data:", error);
                document.querySelector(".error").style.display = "block";
                document.querySelector(".wether").style.display = "none";
            }
        }

        // Event Listeners
        searchBtn.addEventListener("click", () => {
            if (searchBox.value.trim()) {
                checkWeather(searchBox.value);
            }
        });

        searchBox.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && searchBox.value.trim()) {
                checkWeather(searchBox.value);
            }
        });

        // Initial focus
        searchBox.focus();
    </script>
</body>
</html>
